name: Insert coin (visitor board)

# A visitor opens an issue titled "INSERT COIN: ABC"; this adds their initials
# to the hall of fame, replies, and closes the issue.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: arcade-save
  cancel-in-progress: false

jobs:
  coin:
    if: startsWith(github.event.issue.title, 'INSERT COIN')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate initials and update the board
        env: # untrusted input goes through env, never into the script text
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python3 scripts/add_visitor.py > reply.md
          python3 scripts/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet && exit 0
          git commit -m "chore(arcade): new challenger"
          git pull --rebase
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "$(cat reply.md)"
